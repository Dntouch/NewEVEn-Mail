name: NewEVEn Lite build
on:
  push:
    branches: ['**']
    tags: ['neweven-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [static, stalwart]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/project.py prepare
      - run: python3 scripts/project.py install
      - run: python3 scripts/project.py test
      - run: python3 scripts/project.py build --target ${{ matrix.target }}
      - if: matrix.target == 'stalwart'
        run: |
          cd .work/webmail
          npx playwright install --with-deps chromium
      - if: matrix.target == 'stalwart'
        run: |
          python3 scripts/project.py serve --target stalwart > /tmp/neweven-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4173/webmail-test/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-check.mjs
      - if: matrix.target == 'static'
        run: |
          cd .work/webmail
          npx playwright install --with-deps chromium
      - if: matrix.target == 'static'
        run: |
          python3 scripts/project.py demo > /tmp/neweven-demo.log 2>&1 &
          DEMO_PID=$!
          trap 'kill "$DEMO_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4174/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/application-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neweven-${{ matrix.target }}
          path: |
            dist/
            artifacts/

  release:
    if: startsWith(github.ref, 'refs/tags/neweven-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neweven-stalwart
          path: release-artifact
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp release-artifact/dist/neweven-mail-1.17.0-stalwart.zip release/bulwark-lite-stalwart.zip
          cp release-artifact/dist/stalwart-checksums.json release/stalwart-checksums.json
          cd release
          sha256sum bulwark-lite-stalwart.zip stalwart-checksums.json > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/neweven-release-notes.md <<'NOTES'
          NewEVEn Mail auf Basis von Bulwark Lite 1.17.0, mit eigener Anmeldung und hellem/dunklem Anwendungsthema.

          Stalwart-Paket: `bulwark-lite-stalwart.zip`. Zuerst als separate Anwendung unter `/webmail-test/` installieren. Das Paket verwendet den bereitstellenden Stalwart-Server; der Demo-Modus ist ausgeschaltet.

          Beide Build-Ziele, Regressionstests und Browserprüfungen müssen erfolgreich sein, bevor dieses Release veröffentlicht wird. Echte Mailserver-Integrationstests sind zusätzlich auf der eigenen Testinstallation erforderlich.

          Vollständiger Projektaufbau und die festgelegte Upstream-Version sind im Repository am zugehörigen Tag verfügbar. Quellcode mit `git clone --recurse-submodules` laden. Lizenz: AGPL-3.0-only; Hinweise in LICENSE und NOTICE beachten.
          NOTES
          gh release create "$RELEASE_TAG" release/bulwark-lite-stalwart.zip release/stalwart-checksums.json release/SHA256SUMS --repo "$GH_REPO" --verify-tag --title "NewEVEn Mail $RELEASE_TAG" --notes-file /tmp/neweven-release-notes.md
